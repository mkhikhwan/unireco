{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 350px;">
        <h3 class="text-center text-primary mb-3">Login</h3>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <!-- Refers to E-mail -->
                {{ form.username }}
            </div>
            <div class="mb-3">
                {{ form.password }}
            </div>

            <!-- Custom Function to display error using bootstrap classes -->
            {{ form.get_bootstrap_errors|safe }}

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-3">
            <small>Don't have an account? <a href="{% url 'signup' %}" class="text-primary">Sign Up</a></small>
        </div>
    </div>
</div>
{% endblock %}
