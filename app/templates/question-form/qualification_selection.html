{% extends "base.html" %}

{% load static %}

{% block title %}Qualification{% endblock %}

{% block content %}
<div class="container p-2">
    <div class="py-4">
        <h3 class="fw-bold">
            Tell us about your academic background
        </h3>
        <div>
            Please select the type of qualification you have to continue.
        </div>
    </div>

    <div class="d-flex flex-column gap-3">
        <form method="post" action="{% url 'qualification_selection' %}">
            {% csrf_token %}
            
            <div class="d-flex flex-column gap-3">
                <button type="submit" name="qualification_selection" value="diploma" class="btn btn-primary btn-lg fw-bold">
                    Diploma
                </button>
                <button type="submit" name="qualification_selection" value="matriculation" class="btn btn-success btn-lg fw-bold">
                    Matriculation
                </button>
                <button type="submit" name="qualification_selection" value="stpm" class="btn btn-danger btn-lg text-white fw-bold">
                    STPM
                </button>
            </div>
        </form>
    </div>    
</div>
{% endblock %}
