{% extends "base.html" %}

{% load static %}

{% block title %}Qualification - STPM{% endblock %}

{% block content %}
<div class="container p-2">
    <div class="py-4">
        <h3 class="fw-bold">
            Sijil Pelajaran Tinggi Malaysia (STPM)
        </h3>
        <div>
            Please input your STPM results.
        </div>
    </div>
    <form method="post">
        {% csrf_token %}

        <form action="post">
            <div class="mb-4">
                <label for="cgpa" class="form-label mt-3 fw-bold">CGPA:</label>
                <input type="number" id="cgpa" name="cgpa" class="form-control" step="0.01" min="0" max="4" value="0.00">
            </div>

            <div class="fw-bold mb-2">
                Subjects:
            </div>
            <div id="form-container">
                
            </div>

            <button type="button" class="btn btn-outline-primary d-flex justify-content-between align-items-center"
                onclick="addField()">
                <i class="bi bi-plus-circle p-0 mb-1 mr-1"></i>
                <span class="ms-1">Add Course</span>
            </button>

            <div class="text-end">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </form>
</div>

{{ choices|json_script:"choices" }}

<script src="{% static 'js/stpm_form.js' %}"></script>


{% endblock %}
