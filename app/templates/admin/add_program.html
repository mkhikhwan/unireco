{% extends "base.html" %}

{% block title %}UniReco{% endblock %}

{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Add New Programme</h2>
    <form method="post" action="{% url 'admin_add_program' %}">

        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Programme Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="entry_requirement" class="form-label">Entry Requirement</label>
            <select class="form-select" id="entry_requirement" name="entry_requirement">
                {% for req in entry_requirements %}
                    <option value="{{ req.id }}">{{ req.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="university" class="form-label">University</label>
            <select class="form-select" id="university" name="university">
                {% for uni in universities %}
                    <option value="{{ uni.id }}">{{ uni.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Image URL</label>
            <input type="url" class="form-control" id="image" name="image">
        </div>

        <div class="mb-3">
            <label for="duration" class="form-label">Duration</label>
            <input type="text" class="form-control" id="duration" name="duration">
        </div>

        <div class="mb-3">
            <label for="mode" class="form-label">Mode</label>
            <input type="text" class="form-control" id="mode" name="mode">
        </div>

        <div class="mb-3">
            <label for="career_opportunities" class="form-label">Career Opportunities (JSON format)</label>
            <textarea class="form-control" id="career_opportunities" name="career_opportunities" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="url" class="form-label">Programme URL</label>
            <input type="url" class="form-control" id="url" name="url">
        </div>

        <div class="mb-3">
            <label for="degree_field" class="form-label">Degree Field</label>
            <select class="form-select" id="degree_field" name="degree_field">
                {% for field in degree_fields %}
                    <option value="{{ field.id }}">{{ field.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
